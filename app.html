<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PesquisaPro — Protótipo</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <a href="index.html" class="lp-back-home">← Voltar ao site</a>
    <div class="logo">
      <img src="assets/logo-wide.png" alt="PesquisaPro" class="brand-logo brand-logo-login">
    </div>
    <p class="login-sub">Plataforma de pesquisa de opinião, coleta de campo e gestão de pagamentos.</p>

    <div class="field">
      <label>E-mail</label>
      <input type="text" placeholder="seu@email.com" id="li-email">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" placeholder="Sua senha" id="li-pass">
    </div>
    <div id="li-error" class="login-error" style="display:none;color:var(--red,#dc2626);font-size:12.5px;margin:-6px 0 10px"></div>

    <button class="btn-primary" id="li-btn" onclick="doLogin()">Entrar</button>
    <p class="login-foot">Acesso restrito · fale com o administrador para criar sua conta</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="topbar">
    <button class="btn-ghost menu-toggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
    <a href="index.html"><img src="assets/logo-wide.png" alt="PesquisaPro" class="brand-logo brand-logo-topbar"></a>
    <div class="tb-spacer"></div>
    <button class="btn-ghost" onclick="alert('Protótipo: troca de pesquisa/campanha')">Trocar pesquisa ▾</button>
    <div class="tb-user">
      <div class="avatar" id="tbAvatar">AM</div>
      <div><div class="un" id="tbName">Admin Master</div><div class="ur" id="tbRole">Administrador</div></div>
    </div>
    <button class="btn-ghost" onclick="logout()">Sair</button>
  </div>

  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <div class="main" id="main"></div>
</div>

<!-- Bibliotecas externas (gráficos, QR Code e mapa) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<!-- Dados de referência (estados e municípios do Brasil) -->
<script src="br-localidades.js"></script>
<!-- Conexão com o banco de dados (Supabase) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<!-- Código principal do protótipo -->
<script src="app.js"></script>
</body>
</html>
