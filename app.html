<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Painel PesquisaPro para criação de pesquisas, coleta de campo, auditoria e relatórios.">
<meta name="theme-color" content="#2563eb">
<title>PesquisaPro — Painel de pesquisas</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="stylesheet" href="style.css?v=20260830190000">
</head>
<body>
<a class="skip-link" href="#main">Ir para o conteúdo principal</a>
<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <a href="index.html" class="lp-back-home">← Voltar ao site</a>
    <div class="logo">
      <img src="assets/logo-wide.png" alt="PesquisaPro" class="brand-logo brand-logo-login">
    </div>
    <p class="login-sub">Plataforma de pesquisa de opinião, coleta de campo e gestão de pagamentos.</p>

    <div class="field">
      <label for="li-email">E-mail</label>
      <input type="email" placeholder="seu@email.com" id="li-email" autocomplete="username" inputmode="email" required>
    </div>
    <div class="field">
      <label for="li-pass">Senha</label>
      <input type="password" placeholder="Sua senha" id="li-pass" autocomplete="current-password" required>
    </div>
    <div id="li-error" class="login-error" role="alert" aria-live="polite" style="display:none;color:var(--red,#dc2626);font-size:12.5px;margin:-6px 0 10px"></div>

    <button class="btn-primary" id="li-btn" onclick="doLogin()">Entrar</button>
    <p class="login-foot">Acesso restrito · fale com o administrador para criar sua conta</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="topbar" role="banner">
    <button class="btn-ghost menu-toggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
    <a href="index.html"><img src="assets/logo-wide.png" alt="PesquisaPro" class="brand-logo brand-logo-topbar"></a>
    <div class="tb-spacer"></div>
    <button class="btn-ghost" onclick="alert('Protótipo: troca de pesquisa/campanha')">Trocar pesquisa ▾</button>
    <div class="tb-user">
      <div class="avatar" id="tbAvatar">AM</div>
      <div><div class="un" id="tbName">Admin Master</div><div class="ur" id="tbRole">Administrador</div></div>
    </div>
    <button class="btn-ghost" onclick="logout()">Sair</button>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Navegação principal"></nav>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <main class="main" id="main" tabindex="-1" aria-live="polite"></main>
</div>

<!-- Bibliotecas pesadas são carregadas sob demanda pelo app.js, somente nas telas que as utilizam. -->
<!-- Dados de referência (estados e municípios do Brasil) -->
<script src="br-localidades.js"></script>
<!-- Conexão com o banco de dados (Supabase): necessária para autenticação e dados reais -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<!-- Código principal do protótipo -->
<script src="app.js?v=20260830180000"></script>
<script src="commercial.js?v=20260830123000"></script>
</body>
</html>
